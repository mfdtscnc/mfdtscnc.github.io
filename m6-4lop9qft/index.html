<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bruch-Labor: Erweitern &amp; Kürzen</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 0 16px 3rem; background: #fbf8f1; color: #2C2C2A;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 44rem; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 1rem 0; }
  button { font: inherit; padding: .45rem .9rem; margin: 2px; border-radius: 6px; cursor: pointer;
           border: 1px solid #888780; background: #F1EFE8; color: #2C2C2A; min-height: 40px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<nav style="font:15px/1.4 system-ui,-apple-system,sans-serif;padding:10px 16px;max-width:60rem;margin:0 auto"><a href="../l-1r030d1h/" style="color:inherit">← Alle Lernseiten</a></nav>
<main>
<h1>Bruch-Labor: Erweitern &amp; Kürzen</h1>
<style>
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;line-height:1.2}
.fr .den{border-top:2px solid var(--text-primary,#2C2C2A);padding:0 4px}
.bar{display:flex;gap:2px;height:52px;margin:6px 0 14px}
.pc{flex:1;border-radius:3px;box-sizing:border-box}
.on{background:#1D9E75;border:1px solid #0F6E56}
.off{background:var(--surface-1,#F1EFE8);border:1px solid var(--border-strong,#888780)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.lbl{font-size:13px;color:var(--text-secondary,#5F5E5A);min-width:90px}
</style>
<h2 class="sr-only">Interaktive Schokoladentafel: Beim Erweitern und Kürzen ändert sich die Stückzahl, die grüne Fläche bleibt gleich groß.</h2>
<div style="padding:1rem 0;color:var(--text-primary,#2C2C2A)">
<div class="row"><span class="lbl">Start-Bruch</span>
<button onclick="start(3,4)">3/4</button><button onclick="start(2,5)">2/5</button><button onclick="start(1,3)">1/3</button><button onclick="start(8,12)">8/12</button></div>
<div style="font-size:22px;margin:1rem 0;min-height:60px" id="chain"></div>
<div class="lbl">So war es am Anfang</div>
<div class="bar" id="bar0"></div>
<div class="lbl">So ist es jetzt</div>
<div class="bar" id="bar1"></div>
<div class="row"><span class="lbl">Erweitern</span>
<button onclick="erw(2)">· 2</button><button onclick="erw(3)">· 3</button><button onclick="erw(5)">· 5</button></div>
<div class="row"><span class="lbl">Kürzen</span>
<button onclick="kz(2)">: 2</button><button onclick="kz(3)">: 3</button><button onclick="kz(5)">: 5</button></div>
<p id="msg" style="font-size:15px;color:var(--text-secondary,#5F5E5A);margin:1rem 0 0;min-height:48px"></p>
</div>
<script>
let n0,d0,n,d,chain;
function fr(a,b){return '<span class="fr"><span>'+a+'</span><span class="den">'+b+'</span></span>'}
function bar(el,a,b){let h='';for(let i=0;i<b;i++)h+='<div class="pc '+(i<a?'on':'off')+'"></div>';document.getElementById(el).innerHTML=h}
function ggt(a,b){return b?ggt(b,a%b):a}
function render(m){document.getElementById('chain').innerHTML=chain.map(c=>fr(c[0],c[1])).join(' = ');bar('bar0',n0,d0);bar('bar1',n,d);document.getElementById('msg').textContent=m}
function start(a,b){n0=n=a;d0=d=b;chain=[[a,b]];render('Die grüne Fläche ist deine Schokolade, die grauen Stücke gehören zur Tafel dazu. Drück auf einen Knopf!')}
function erw(k){if(d*k>60){render('Stopp, so viele Stücke passen nicht mehr auf die Tafel. Probier mal Kürzen!');return}n*=k;d*=k;chain.push([n,d]);render('Jedes Stück wurde in '+k+' kleinere Stücke geschnitten. Oben mal '+k+', unten mal '+k+'. Vergleich die grünen Flächen: gleich groß!')}
function kz(k){if(n%k||d%k){render('Geht nicht: '+n+' und '+d+' lassen sich nicht beide durch '+k+' teilen. Oben und unten muss es aufgehen!');return}n/=k;d/=k;chain.push([n,d]);let m='Immer '+k+' Stücke wurden zu einem großen zusammengelegt. Oben geteilt durch '+k+', unten geteilt durch '+k+'.';if(ggt(n,d)===1)m+=' Jetzt geht nichts mehr: vollständig gekürzt!';render(m)}
start(3,4);
</script>
</main>
</body>
</html>
